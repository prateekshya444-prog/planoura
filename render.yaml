# Planora beta — Render Blueprint
# Apply from Dashboard: New > Blueprint > Connect repo > select branch with this file
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: planora-db
    databaseName: planora
    plan: free

services:
  - type: web
    name: planora-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: planora-db
          property: connectionString
